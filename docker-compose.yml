services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce-agent-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

    depends_on:
      - redis


  redis:
  image: redis:latest

  container_name: ecommerce-agent-redis

  ports:
    - "6379:6379"

  healthcheck:
    test:
      [
        "CMD",
        "redis-cli",
        "ping"
      ]
    interval: 10s
    timeout: 5s
    retries: 5